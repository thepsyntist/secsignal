name: probe-models
on: workflow_dispatch
permissions:
  models: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe GitHub Models endpoints
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body='{"model":"openai/gpt-4.1-mini","messages":[{"role":"user","content":"Say hi"}],"max_tokens":5}'
          probe() {
            echo "=================== $1 $2"
            curl -sS -i -m 30 -X "$1" "$2" \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" -H "Content-Type: application/json" \
              ${3:+-d "$3"} | head -c 1500; echo
          }
          probe GET  https://models.github.ai/catalog/models
          probe POST https://models.github.ai/inference/chat/completions "$body"
          probe POST https://models.github.ai/inference/chat/completions/ "$body"
          probe POST "https://models.github.ai/orgs/${{ github.repository_owner }}/inference/chat/completions" "$body"
          probe POST https://models.inference.ai.azure.com/chat/completions "$body"
          python3 - <<'PY'
          import os, requests
          r = requests.post("https://models.github.ai/inference/chat/completions",
              headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}", "Content-Type": "application/json"},
              json={"model": "openai/gpt-4.1-mini", "messages": [{"role": "user", "content": "Say hi"}], "max_tokens": 5}, timeout=30)
          print("=================== python requests", r.status_code, r.headers.get("content-type"), r.text[:500])
          PY
