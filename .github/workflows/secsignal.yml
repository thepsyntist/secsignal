name: secsignal

on:
  schedule:
    - cron: "23 */2 * * *"  # every 2 hours
  workflow_dispatch:

permissions:
  contents: write
  models: read  # free GitHub Models inference via GITHUB_TOKEN

concurrency:
  group: secsignal
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Run
        run: python -m secsignal
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}  # only if you switch llm.base_url
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

      - name: Commit state and outputs
        run: |
          git config user.name "secsignal"
          git config user.email "secsignal@users.noreply.github.com"
          git add -A  # only state/, out/ and digests/ change during a run
          git diff --cached --quiet && exit 0
          git commit -m "secsignal: update $(date -u +%FT%H:%MZ)"
          git pull --rebase --quiet && git push
